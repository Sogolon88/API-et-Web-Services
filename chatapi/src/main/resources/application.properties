spring.application.name=chatapi

# Base H2 enregistrée dans chatapi/data : le projet démarre sans rien installer et les messages
# survivent à un redémarrage. Profil "postgres" pour utiliser PostgreSQL (application-postgres.properties).
spring.datasource.url=jdbc:postgres:file:./data/chatapi
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Clé HMAC d'au moins 32 caractères, lue dans l'environnement. Absente : clé aléatoire générée
# au démarrage (voir JwtService). Durée de 2 h, suffisante pour une session de démonstration.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=7200000

# Limitation de débit : au plus 20 messages par utilisateur sur toute période de 10 s.
# Largement au-dessus d'un usage humain, mais bloque un script qui inonderait un destinataire.
chat.limite.messages=20
chat.limite.fenetre-ms=10000

# Webhook appelé quand le destinataire d'un message est hors ligne. Vide par défaut :
# le service tiers est alors simulé par une ligne de log "Notification envoyée à...".
chat.webhook.url=${CHAT_WEBHOOK_URL:}
