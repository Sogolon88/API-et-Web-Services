spring.application.name=chatapi

# Les secrets sont lus dans les variables d'environnement : rien de sensible dans le dépôt.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chatapiDB}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Clé HMAC d'au moins 32 caractères. Durée de 2 h, suffisante pour une session de démonstration.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=7200000
