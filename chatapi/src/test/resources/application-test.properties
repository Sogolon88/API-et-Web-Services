# Base en mémoire, recréée à chaque lancement : les tests ne touchent jamais aux données de démonstration.
spring.datasource.url=jdbc:h2:mem:chatapi-test;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Limite basse pour pouvoir la dépasser rapidement dans les tests.
chat.limite.messages=5
